<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0E23"/>
      <stop offset="0.55" stop-color="#19204A"/>
      <stop offset="1" stop-color="#2B2081"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9F87FF"/>
      <stop offset="0.45" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4D7CFE"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: move 14s linear infinite; }
    .w2 { animation: move 9s linear infinite reverse; }
    .w3 { animation: move 11s linear infinite; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .title { font: 800 62px 'Poppins','Segoe UI', Helvetica, Arial, sans-serif; fill: #EEF0FF; letter-spacing: 1px;
             opacity: 0; animation: fade 1.6s ease-out forwards; }
    .sub   { font: 500 21px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #C9BCFF; letter-spacing: 1px;
             opacity: 0; animation: fade 1.6s 0.6s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- back wave -->
  <path class="w1" fill="#7C5CFF" opacity="0.35"
        d="M0 190 Q150 240 300 190 T600 190 T900 190 T1200 190 T1500 190 T1800 190 V0 H0 Z"/>
  <!-- middle wave -->
  <path class="w3" fill="#4D7CFE" opacity="0.35"
        d="M0 180 Q150 140 300 180 T600 180 T900 180 T1200 180 T1500 180 T1800 180 V0 H0 Z"/>
  <!-- front wave -->
  <path class="w2" fill="url(#bg)"
        d="M0 170 Q150 205 300 170 T600 170 T900 170 T1200 170 T1500 170 T1800 170 V0 H0 Z"/>

  <text x="600" y="92" text-anchor="middle" class="title">Islem <tspan fill="url(#grad)">Jomaa</tspan></text>
  <text x="600" y="135" text-anchor="middle" class="sub">Industrial Computer Engineer • Computer Vision • 3D Perception • Robotics</text>
</svg>
