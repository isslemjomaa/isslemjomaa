<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B2081"/>
      <stop offset="0.45" stop-color="#19204A"/>
      <stop offset="1" stop-color="#0A0E23"/>
    </linearGradient>
  </defs>
  <style>
    .w1 { animation: move 12s linear infinite; }
    .w2 { animation: move 8s linear infinite reverse; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .s { fill: #C9BCFF; animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: 0.6s; } .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.8s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
  </style>

  <path class="w1" fill="#7C5CFF" opacity="0.35"
        d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30 V130 H0 Z"/>
  <path class="w2" fill="url(#bg)"
        d="M0 45 Q150 70 300 45 T600 45 T900 45 T1200 45 T1500 45 T1800 45 V130 H0 Z"/>

  <circle class="s" cx="120" cy="95" r="2"/>
  <circle class="s s2" cx="260" cy="110" r="1.5"/>
  <circle class="s s3" cx="410" cy="88" r="2.2"/>
  <circle class="s s4" cx="560" cy="112" r="1.6"/>
  <circle class="s s2" cx="700" cy="92" r="2"/>
  <circle class="s s3" cx="850" cy="108" r="1.5"/>
  <circle class="s" cx="980" cy="90" r="2.2"/>
  <circle class="s s4" cx="1100" cy="105" r="1.7"/>
</svg>
